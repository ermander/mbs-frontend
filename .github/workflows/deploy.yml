name: Build and Deploy Frontend

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ghcr.io/ermander/mbs-frontend

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ermander
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, arm64, frontend]
    timeout-minutes: 30

    steps:
      - name: Deploy frontend with Docker Compose
        run: |
          set -e
          cd /opt/mbs-infra

          echo "Pull latest frontend image"
          docker compose pull mbs-frontend

          echo "Restart frontend container"
          docker compose up -d mbs-frontend

          echo "Running containers:"
          docker compose ps

          echo "Verify local frontend"
          curl -I http://127.0.0.1:3002

          echo "Verify frontend API proxy"
          curl http://127.0.0.1:3002/api/health
