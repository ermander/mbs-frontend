name: Build and Deploy Frontend

on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: ghcr.io/ermander/mbs-frontend

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ermander
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, linux, arm64, frontend]
    timeout-minutes: 30

    steps:
      - name: Log in to GHCR on self-hosted runner
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ermander --password-stdin

      - name: Deploy frontend with Docker Compose
        run: |
          set -e
          # One deploy or cleanup at a time on this host: the backend workflow
          # runs on a second runner here and its cleanup pruned this container
          # while still "Created" (backend ADAPTER_STATUS §14.26). The lock is
          # released when this step's shell exits.
          exec 9>/srv/mbs-infra/.deploy.lock
          flock -w 1200 9
          cd /srv/mbs-infra

          echo "Pull latest frontend image"
          docker compose pull mbs-frontend

          echo "Restart frontend container"
          docker compose up -d mbs-frontend

          echo "Waiting for frontend container to become healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' mbs-frontend 2>/dev/null || echo "missing")
            echo "Attempt $i - mbs-frontend status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              break
            fi

            sleep 2
          done

          FINAL_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' mbs-frontend)
          if [ "$FINAL_STATUS" != "healthy" ]; then
            echo "Frontend did not become healthy"
            docker compose ps
            docker compose logs mbs-frontend --tail 100
            exit 1
          fi

          echo "Running containers:"
          docker compose ps

          echo "Verify local frontend"
          curl -I --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:3002

          echo "Verify frontend API proxy"
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:3002/api/health

      - name: Clean up Docker (free disk for next run)
        if: always()
        run: |
          exec 9>/srv/mbs-infra/.deploy.lock
          flock -w 1200 9 || { echo "deploy lock busy for 20 minutes, cleanup skipped"; exit 1; }
          # Images only: `system prune` also removes stopped containers, and a
          # container the other workflow has just created but not yet started
          # counts as stopped (§14.26).
          docker image prune -af
          docker builder prune -af
